# Strata on an AMD card. gfx120X image: RX 9000 series and Radeon AI PRO R9700 (RDNA4). gfx110X image: RX 7000 series (RDNA3).
# Needs the amdgpu kernel driver on the host (the ROCm user-space is in the image).
#
#   cp .env.example .env
#   docker compose -f docker-compose.amd.yml up -d
#
# Images: ghcr.io/niko1221/strata (published from 0.2.1 on). To use one you built yourself: STRATA_IMAGE=strata:0.2.20-<flavor> docker compose up -d
services:
  strata:
    image: ${STRATA_IMAGE:-ghcr.io/niko1221/strata:0.2.20-rocm-gfx120x}
    container_name: strata
    restart: unless-stopped
    ports:
      - "${STRATA_BIND:-127.0.0.1}:${STRATA_PORT:-8080}:8080"
    environment:
      FAMILY: ${FAMILY:-}                    # qwen, qwen36, hy4-flash, inkling-2-mini, unsloth, ...
      MODEL: ${MODEL:-}
      MODEL_PATH: ${MODEL_PATH:-}            # .gguf, .strata, or .safetensors files you already have, as seen inside the container (mount them below)
      CONTEXT: ${CONTEXT:-32k}
      PARALLEL: ${PARALLEL:-}
      VISION: ${VISION:-off}
      TUNE: ${TUNE:-skip}
      STAY_UP: ${STAY_UP:-}     # 1: keep the container up while the server is not running, so a model can be switched in it (docs/DOCKER.md, "Changing the model at runtime")
      API_KEY: ${API_KEY:-}
    volumes:
      - strata-data:/data
      # - /srv/gguf/IQ3_XXS:/models:ro
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - "${RENDER_GID:-render}"              # the host's render group id: getent group render | cut -d: -f3 (needed if you add `user:`; root does not need it)
    ulimits:
      memlock: { soft: -1, hard: -1 }
    shm_size: 2gb
    stop_grace_period: 2m
    # a health status does not restart a plain container; for a model switch at runtime, disable the health check
    # (`healthcheck: { disable: true }`) and use STAY_UP=1, docs/DOCKER.md "Changing the model at runtime"
    # security_opt: [seccomp:unconfined]     # only if the log says a ROCm call was blocked (rare)
volumes:
  strata-data:
